# Fly.io config. Deploy with:
#   fly launch --copy-config --ha=false     # first time (creates the app)
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...   # for real AI bookings
#   fly deploy                               # subsequent deploys
#
# Rename `app` to something unique before your first launch.
app = "concierge-booking"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

# Chromium needs headroom — 256MB will OOM. 1GB is a safe starting point.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
