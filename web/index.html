<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0a0a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Concierge">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Concierge — AI Reservations</title>
</head>
<body>
  <div class="glow"></div>

  <header class="appbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="26" height="26">
      <span>Concierge</span>
    </div>
    <button id="modePill" class="pill" title="Booking mode"></button>
  </header>

  <!-- ============ ASSISTANT ============ -->
  <main id="view-assistant" class="view">
    <section class="hero">
      <p class="eyebrow">Your AI reservations concierge</p>
      <h1 class="headline">Just ask. I'll book it.</h1>

      <button id="mic" class="orb" aria-label="Speak your request">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="9" y="3" width="6" height="12" rx="3"/>
          <path d="M6 11a6 6 0 0 0 12 0M12 17v4"/>
        </svg>
        <span class="orb-ring"></span>
      </button>
      <p id="micHint" class="mic-hint">Tap to speak</p>

      <form id="promptForm" class="prompt">
        <input id="prompt" type="text" autocomplete="off"
               placeholder="Book a table for 2 at Nopa, Friday 7pm">
        <button type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </form>

      <div class="chips" id="chips">
        <button data-fill="Book a table for 2 tonight at 7:30">Table for 2 tonight</button>
        <button data-fill="Dinner for four this Friday at 8, window seat">Dinner Friday · 4</button>
        <button data-fill="Brunch this weekend for 3 at 11am">Weekend brunch</button>
      </div>
    </section>

    <section id="intentWrap"></section>
  </main>

  <!-- ============ CALENDAR ============ -->
  <main id="view-calendar" class="view" hidden>
    <div class="view-head">
      <h2>Calendar</h2>
      <a id="subscribe" class="ghost-btn" href="/api/reservations.ics">Add to phone</a>
    </div>
    <div id="monthStrip" class="month-strip"></div>
    <div id="agenda" class="agenda"></div>
  </main>

  <!-- ============ ACTIVITY ============ -->
  <main id="view-activity" class="view" hidden>
    <div class="view-head"><h2>Activity</h2></div>
    <div id="activity" class="agenda"></div>
  </main>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="tabbar">
    <button data-view="assistant" class="tab active">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 16.6 7.1 18.2 8 12.7 4 8.8 9.5 8z"/></svg>
      <span>Ask</span>
    </button>
    <button data-view="calendar" class="tab">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      <span>Calendar</span>
    </button>
    <button data-view="activity" class="tab">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>
      <span>Activity</span>
    </button>
  </nav>

  <!-- ============ LIVE BOOKING SHEET ============ -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <div>
          <h3 id="sheetTitle">Booking…</h3>
          <p id="sheetSub" class="muted"></p>
        </div>
        <button id="sheetClose" class="ghost-btn" hidden>Done</button>
      </div>
      <div id="sheetBanner" class="banner" hidden></div>
      <ol id="sheetLog" class="timeline"></ol>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
