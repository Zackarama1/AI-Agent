<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Booking Agent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Booking Agent</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <span>Booking Agent</span>
    </div>
    <span id="modePill" class="pill" title="Run mode">…</span>
  </header>

  <main>
    <section class="card">
      <label class="field">
        <span>Template</span>
        <select id="template"><option value="">Loading…</option></select>
      </label>

      <label class="field">
        <span>What should the agent do?</span>
        <textarea id="instruction" rows="4"
          placeholder="e.g. Book a table for 2 this Friday at 7pm under Test User"></textarea>
      </label>

      <label class="field">
        <span>Start URL</span>
        <input id="startUrl" type="text" inputmode="url" placeholder="https://…">
      </label>

      <label class="field row">
        <span>Force dry run</span>
        <input id="dryRun" type="checkbox">
        <small id="dryHint">no API key needed — scripted demo</small>
      </label>

      <button id="run" class="primary">Run agent</button>
    </section>

    <section id="resultBanner" class="banner" hidden></section>

    <section class="timeline-wrap">
      <div class="timeline-head">
        <h2>Live steps</h2>
        <span id="stepCount" class="muted"></span>
      </div>
      <ol id="timeline" class="timeline"></ol>
      <p id="empty" class="muted center">Run a task to watch the agent work, step by step.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
