<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Newsletter Signup</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    label { display: block; margin: 14px 0 4px; font-size: 14px; color: #444; }
    input { width: 100%; padding: 10px; font-size: 15px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 11px 16px; font-size: 15px; cursor: pointer; }
    #done { margin-top: 18px; padding: 12px; background: #e6f8ef; border: 1px solid #3ecf8e; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Newsletter Signup</h1>
  <p>A local practice form for the agent — no data leaves this machine.</p>
  <form id="f" onsubmit="return false">
    <label for="name">Name</label>
    <input id="name" name="name" placeholder="Your name">
    <label for="email">Email</label>
    <input id="email" name="email" placeholder="Email address">
    <button type="button" id="subscribe"
      onclick="document.getElementById('done').style.display='block'">Subscribe</button>
  </form>
  <div id="done" style="display:none">Thanks — you are subscribed!</div>
</body>
</html>
