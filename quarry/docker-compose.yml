# QUARRY local stack. `make up` builds and starts everything.
# Ports are published on 127.0.0.1 only; remote (iPad) access goes via Tailscale.

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: quarry
      POSTGRES_PASSWORD: quarry
      POSTGRES_DB: quarry
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarry"]
      interval: 5s
      retries: 20

  cache:
    image: valkey/valkey:8.1
    command: ["valkey-server", "--save", "60", "1"]
    volumes: [cachedata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: [{ path: .env, required: false }]
    environment: &svc_env
      DATABASE_URL: postgresql+asyncpg://quarry:quarry@db:5432/quarry
      REDIS_URL: redis://cache:6379/0
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    command: ["quarry-api"]
    env_file: [{ path: .env, required: false }]
    environment:
      <<: *svc_env
      API_HOST: 0.0.0.0   # inside the container; the host port below is 127.0.0.1-only
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      cache: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      retries: 10

  worker:
    build: .
    command: ["quarry-worker"]
    env_file: [{ path: .env, required: false }]
    environment: *svc_env
    depends_on:
      migrate: { condition: service_completed_successfully }
      cache: { condition: service_healthy }

volumes:
  dbdata:
  cachedata:
