name: QUARRY CI

on:
  push:
    paths: ["quarry/**", ".github/workflows/quarry-ci.yml"]
  pull_request:
    paths: ["quarry/**", ".github/workflows/quarry-ci.yml"]

permissions:
  contents: read

concurrency:
  group: quarry-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql+asyncpg://quarry:quarry@localhost:5432/quarry_test
  TEST_REDIS_URL: redis://localhost:6379/15

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: quarry/backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: quarry, POSTGRES_PASSWORD: quarry, POSTGRES_DB: quarry_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quarry" --health-interval 5s --health-retries 20
      valkey:
        image: valkey/valkey:8.1
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -ra
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m quarry.api.openapi > openapi.json
          git diff --exit-code -- openapi.json
      - run: uv run pip-audit --strict --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: quarry/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: quarry/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated API types match the schema
        run: pnpm gen:api && git diff --exit-code -- src/api/schema.ts
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm audit --prod --audit-level high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: quarry, POSTGRES_PASSWORD: quarry, POSTGRES_DB: quarry }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quarry" --health-interval 5s --health-retries 20
      valkey:
        image: valkey/valkey:8.1
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://quarry:quarry@localhost:5432/quarry
      REDIS_URL: redis://localhost:6379/0
      ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: quarry/frontend/pnpm-lock.yaml
      - name: Build SPA
        working-directory: quarry/frontend
        run: pnpm install --frozen-lockfile && pnpm build && pnpm exec playwright install --with-deps chromium webkit
      - name: Start stack
        working-directory: quarry/backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          STATIC_DIR=$GITHUB_WORKSPACE/quarry/frontend/dist nohup uv run quarry-api > api.log 2>&1 &
          nohup uv run quarry-worker > worker.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Playwright (desktop, iPad Chromium, iPad WebKit)
        working-directory: quarry/frontend
        run: pnpm e2e
        env: { E2E_WEBKIT: "1", CI: "1" }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            quarry/frontend/playwright-report
            quarry/backend/*.log

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
