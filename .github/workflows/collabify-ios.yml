name: Collabify app
on:
  push:
    paths: ['collabify/**', '.github/workflows/collabify-ios.yml']
  pull_request:
    paths: ['collabify/**', '.github/workflows/collabify-ios.yml']

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collabify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collabify/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test

  edge-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collabify/supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check */index.ts
      - run: deno lint
      - run: deno test --allow-env _shared/

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + RLS rule tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPORT: 5432
        run: |
          out=$(collabify/supabase/tests/run.sh)
          echo "$out"
          if echo "$out" | grep -qE "FAILED|ERROR"; then exit 1; fi
