name: Collabify CI
on:
  push:
    paths: ['collabify/**', '.github/workflows/collabify.yml']
  pull_request:
    paths: ['collabify/**', '.github/workflows/collabify.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collabify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collabify/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
