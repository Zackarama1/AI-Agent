<title>TradeShield — My Business</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* ==========================================================================
   TradeShield — Commercial App (immersive dark UI)
   Mobile-first PWA · Capacitor-ready for App Store
   ========================================================================== */

:root {
  --bg-0:      #050b1c;
  --bg-1:      #081228;
  --bg-2:      #0b1a38;
  --panel:     rgba(17, 33, 66, 0.62);
  --panel-2:   rgba(23, 42, 82, 0.55);
  --panel-solid:#0e1e40;
  --line:      rgba(120, 160, 220, 0.16);
  --line-2:    rgba(120, 160, 220, 0.28);

  --navy:      #0d1b3a;
  --teal:      #29c2d8;
  --teal-dim:  #1c93a6;
  --blue:      #3b82f6;
  --blue-2:    #2f6bff;
  --gold:      #d8b866;
  --gold-dim:  #b8963f;

  --ink:       #eaf1ff;
  --ink-soft:  #9fb2d6;
  --ink-faint: #6b7ea6;

  --ok:        #35d29a;
  --warn:      #f0b64a;
  --danger:    #ff6b5e;
  --info:      #56a8ff;

  --glow-teal: 0 0 24px rgba(41, 194, 216, 0.35);
  --glow-blue: 0 0 30px rgba(59, 130, 246, 0.4);
  --radius:    18px;
  --radius-sm: 12px;
  --shadow:    0 20px 50px rgba(0, 0, 0, 0.45);
  --font:      -apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --tab-h:     72px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1100px 700px at 85% -5%, rgba(41,194,216,0.10), transparent 60%),
    radial-gradient(900px 600px at 0% 100%, rgba(59,130,246,0.10), transparent 55%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1,h2,h3,h4 { margin: 0 0 .4em; line-height: 1.18; color: #fff; letter-spacing: .2px; }
p { margin: 0 0 1em; color: var(--ink-soft); }
a { color: var(--teal); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* ---------- app frame ---------- */
#app { min-height: 100%; }
.screen { display: none; padding: 20px 18px calc(var(--tab-h) + 28px); max-width: 1180px; margin: 0 auto; animation: fade .28s ease; }
.screen.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 12px;
  background: linear-gradient(180deg, rgba(5,11,28,.92), rgba(5,11,28,.55) 70%, transparent);
  backdrop-filter: blur(10px);
}
.topbar .tb-title { font-size: 1.28rem; font-weight: 700; color: #fff; }
.topbar .tb-sub { font-size: .74rem; color: var(--ink-faint); }
.topbar .tb-right { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink-soft); display: grid; place-items: center;
  transition: .15s;
}
.icon-btn:hover { color: #fff; border-color: var(--line-2); }
.icon-btn svg { width: 19px; height: 19px; }
.avatar {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  font-weight: 700; font-size: .82rem; color: #04121e;
  background: linear-gradient(135deg, var(--teal), var(--blue));
  box-shadow: var(--glow-teal);
}
.back-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--teal); font-size: .92rem; font-weight: 600; padding: 0; }

/* ---------- brand mark ---------- */
.tsmark { width: 34px; height: 38px; filter: drop-shadow(0 0 8px rgba(41,194,216,.5)); }

/* ---------- cards ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  backdrop-filter: blur(14px);
  box-shadow: var(--shadow);
  padding: 18px;
}
.card + .card { margin-top: 14px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card-head h2 { font-size: 1.04rem; }
.card-head .sub { font-size: .78rem; color: var(--ink-faint); }

.section-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .16em; color: var(--teal); font-weight: 700; margin: 22px 2px 12px; }
.section-label:first-child { margin-top: 6px; }

/* ---------- KPI grid ---------- */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat {
  position: relative; overflow: hidden;
  border-radius: var(--radius-sm); padding: 15px 15px 14px;
  background: var(--panel-2); border: 1px solid var(--line);
}
.stat::after { content:""; position:absolute; right:-30px; top:-30px; width:90px; height:90px; border-radius:50%; background: radial-gradient(circle, rgba(41,194,216,.18), transparent 70%); }
.stat .s-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); display: flex; align-items: center; gap: 7px; }
.stat .s-val { font-size: 1.5rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; margin-top: 6px; }
.stat .s-delta { font-size: .74rem; margin-top: 2px; }
.s-up { color: var(--ok); } .s-down { color: var(--danger); }
.stat.accent { border-color: rgba(41,194,216,.4); box-shadow: inset 0 0 24px rgba(41,194,216,.08); }
.stat.danger .s-val { color: var(--danger); }
.stat.gold .s-val { color: var(--gold); }

/* ---------- pills / badges ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: .7rem; font-weight: 700; letter-spacing: .02em; border: 1px solid transparent; }
.pill.ok       { background: rgba(53,210,154,.14); color: var(--ok); border-color: rgba(53,210,154,.3); }
.pill.warn     { background: rgba(240,182,74,.14); color: var(--warn); border-color: rgba(240,182,74,.3); }
.pill.danger   { background: rgba(255,107,94,.14); color: var(--danger); border-color: rgba(255,107,94,.3); }
.pill.info     { background: rgba(86,168,255,.14); color: var(--info); border-color: rgba(86,168,255,.3); }
.pill.neutral  { background: rgba(120,160,220,.12); color: var(--ink-soft); border-color: var(--line); }
.pill.teal     { background: rgba(41,194,216,.14); color: var(--teal); border-color: rgba(41,194,216,.32); }
.risk-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.risk-low  { background: var(--ok); box-shadow: 0 0 8px rgba(53,210,154,.7); }
.risk-med  { background: var(--warn); box-shadow: 0 0 8px rgba(240,182,74,.7); }
.risk-high { background: var(--danger); box-shadow: 0 0 8px rgba(255,107,94,.7); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: 13px; padding: 13px 20px; font-size: .96rem; font-weight: 700;
  transition: transform .12s, box-shadow .12s, filter .12s;
}
.btn:active { transform: scale(.98); }
.btn-primary { color: #04121e; background: linear-gradient(135deg, var(--teal), var(--blue)); box-shadow: var(--glow-blue); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); }
.btn-ghost:hover { border-color: var(--teal); color: #fff; }
.btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-dim)); color: #221803; }
.btn-block { width: 100%; }
.btn-sm { padding: 9px 14px; font-size: .84rem; border-radius: 10px; }
.btn-danger { background: rgba(255,107,94,.14); color: var(--danger); border: 1px solid rgba(255,107,94,.35); }

/* ---------- list rows (companies, cases) ---------- */
.row-list { display: grid; gap: 10px; }
.list-row {
  display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 13px 14px; transition: .15s; color: inherit;
}
.list-row:hover { border-color: var(--line-2); background: var(--panel-2); transform: translateX(2px); }
.list-row .lr-logo {
  width: 44px; height: 44px; border-radius: 12px; flex: none; display: grid; place-items: center;
  font-weight: 800; font-size: .95rem; color: #fff;
}
.list-row .lr-main { flex: 1; min-width: 0; overflow: hidden; }
.list-row .lr-meta { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row .lr-name { display: block; font-weight: 700; color: #fff; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row .lr-meta { font-size: .77rem; color: var(--ink-faint); margin-top: 2px; }
.list-row .lr-right { text-align: right; flex: none; }
.list-row .lr-fig { font-weight: 700; font-variant-numeric: tabular-nums; }
.list-row .chev { color: var(--ink-faint); flex: none; }

/* ---------- search ---------- */
.search { position: relative; margin-bottom: 14px; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-faint); }
.search input {
  width: 100%; padding: 13px 14px 13px 42px; border-radius: 13px;
  background: var(--panel); border: 1px solid var(--line); color: var(--ink); font-size: .95rem; font-family: inherit;
}
.search input::placeholder { color: var(--ink-faint); }
.search input:focus { outline: none; border-color: var(--teal); box-shadow: var(--glow-teal); }

/* ---------- segmented control ---------- */
.segment { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 16px; overflow-x: auto; }
.segment button { flex: 1; white-space: nowrap; border: none; background: none; color: var(--ink-soft); font-weight: 600; font-size: .84rem; padding: 8px 12px; border-radius: 9px; transition: .15s; }
.segment button.active { background: linear-gradient(135deg, rgba(41,194,216,.9), rgba(59,130,246,.9)); color: #041018; }

/* ---------- kanban (creditor cases) ---------- */
.kanban { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.kanban::-webkit-scrollbar { height: 6px; }
.kanban::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
.kan-col { flex: 0 0 78%; max-width: 300px; scroll-snap-align: start; }
.kan-col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 3px; }
.kan-col-head .kc-name { font-weight: 700; font-size: .84rem; color: #fff; display: flex; align-items: center; gap: 8px; }
.kan-col-head .kc-count { font-size: .72rem; color: var(--ink-faint); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.kan-stage-bar { height: 3px; border-radius: 3px; margin-bottom: 10px; }
.case-card { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 13px; margin-bottom: 10px; transition: .15s; width: 100%; text-align: left; color: inherit; display: block; }
.case-card:hover { border-color: var(--line-2); transform: translateY(-2px); }
.case-card .cc-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.case-card .cc-cred { font-weight: 700; color: #fff; font-size: .92rem; }
.case-card .cc-cat { font-size: .72rem; color: var(--ink-faint); }
.case-card .cc-amt { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gold); margin-top: 8px; }
.case-card .cc-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: .72rem; color: var(--ink-faint); }

@media (min-width: 780px) {
  .kanban { display: grid; grid-template-columns: repeat(5, 1fr); overflow: visible; }
  .kan-col { flex: none; max-width: none; }
}

/* ---------- timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content:""; position: absolute; left: 15px; top: 8px; bottom: 8px; width: 2px; background: var(--line-2); }
.timeline li { position: relative; padding: 0 0 18px 44px; }
.timeline li:last-child { padding-bottom: 0; }
.tl-node { position: absolute; left: 7px; top: 2px; width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--bg-0); display: grid; place-items: center; }
.tl-node.ok    { background: var(--ok); }
.tl-node.info  { background: var(--info); }
.tl-node.warn  { background: var(--warn); }
.tl-node.teal  { background: var(--teal); }
.tl-title { font-weight: 700; color: #fff; font-size: .9rem; }
.tl-meta  { font-size: .74rem; color: var(--ink-faint); }
.tl-desc  { font-size: .84rem; color: var(--ink-soft); margin-top: 3px; }

/* ---------- progress / meters ---------- */
.meter { height: 9px; border-radius: 999px; background: rgba(120,160,220,.14); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--teal), var(--blue)); }
.stage-track { display: flex; gap: 5px; margin: 12px 0; }
.stage-track .st-seg { flex: 1; height: 6px; border-radius: 3px; background: rgba(120,160,220,.16); }
.stage-track .st-seg.done { background: linear-gradient(90deg, var(--teal), var(--blue)); }
.stage-track .st-seg.current { background: var(--gold); box-shadow: 0 0 10px rgba(216,184,102,.6); }

/* ---------- donut ---------- */
.donut-wrap { position: relative; width: 150px; margin: 4px auto 6px; }
.donut { width: 150px; height: 150px; transform: rotate(-90deg); }
.donut .trk { fill: none; stroke: rgba(120,160,220,.16); stroke-width: 12; }
.donut .val { fill: none; stroke: url(#tsg); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.donut-center b { font-size: 1.7rem; color: #fff; }
.donut-center span { font-size: .62rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); }

/* ---------- integrations ---------- */
.integration { display: flex; align-items: center; gap: 14px; }
.integration .int-logo { width: 52px; height: 52px; border-radius: 14px; flex: none; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: .9rem; }
.integration .int-main { flex: 1; }
.integration .int-name { font-weight: 700; color: #fff; }
.integration .int-status { font-size: .78rem; color: var(--ink-faint); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.sync-log { font-size: .82rem; color: var(--ink-soft); border-left: 2px solid var(--line-2); padding-left: 12px; margin-top: 12px; display: grid; gap: 8px; }
.sync-log .sl-row { display: flex; gap: 8px; align-items: baseline; }
.sync-log .sl-time { color: var(--ink-faint); font-size: .72rem; flex: none; }

/* ---------- bottom tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; height: var(--tab-h);
  display: flex; padding: 8px 8px calc(env(safe-area-inset-bottom, 0px) + 6px);
  background: linear-gradient(180deg, rgba(8,18,40,.85), rgba(5,11,28,.98));
  backdrop-filter: blur(18px); border-top: 1px solid var(--line);
}
.tabbar button {
  flex: 1; border: none; background: none; color: var(--ink-faint);
  display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .64rem; font-weight: 600;
  transition: color .15s;
}
.tabbar button svg { width: 23px; height: 23px; }
.tabbar button.active { color: var(--teal); }
.tabbar button.active svg { filter: drop-shadow(0 0 6px rgba(41,194,216,.7)); }
@media (min-width: 780px) { .tabbar { max-width: 620px; margin: 0 auto; border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: none; } }

/* ---------- login ---------- */
.login-screen { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; max-width: 440px; margin: 0 auto; }
.login-hero { text-align: center; margin-bottom: 34px; }
.login-hero .lh-mark { width: 76px; height: 84px; margin: 0 auto 18px; filter: drop-shadow(0 0 22px rgba(41,194,216,.55)); }
.login-hero h1 { font-size: 2rem; letter-spacing: 1px; }
.login-hero h1 .t { color: var(--teal); } .login-hero h1 .s { color: var(--blue); }
.login-hero p { color: var(--ink-soft); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: .8rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
.field input {
  width: 100%; padding: 14px; border-radius: 13px; background: var(--panel);
  border: 1px solid var(--line); color: var(--ink); font-size: 1rem; font-family: inherit;
}
.field input:focus { outline: none; border-color: var(--teal); box-shadow: var(--glow-teal); }
.login-alt { text-align: center; margin-top: 18px; font-size: .84rem; color: var(--ink-faint); }
.demo-note { text-align: center; font-size: .74rem; color: var(--ink-faint); margin-top: 26px; padding: 12px; border: 1px dashed var(--line-2); border-radius: 12px; }

/* ---------- misc ---------- */
.muted { color: var(--ink-faint); }
.right { text-align: right; }
.flex-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chart-svg { width: 100%; height: auto; display: block; }
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.empty { text-align: center; color: var(--ink-faint); padding: 40px 20px; font-size: .9rem; }
.grid-2 { display: grid; gap: 14px; }
@media (min-width: 780px) { .grid-2 { grid-template-columns: 1fr 1fr; } .stat-grid { grid-template-columns: repeat(4, 1fr); } }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + 18px); transform: translateX(-50%) translateY(20px);
  background: var(--panel-solid); border: 1px solid var(--line-2); color: #fff; padding: 12px 18px;
  border-radius: 13px; font-size: .88rem; font-weight: 600; box-shadow: var(--shadow); z-index: 100;
  opacity: 0; transition: .3s; pointer-events: none; max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- modal sheet ---------- */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(3,8,20,.6); backdrop-filter: blur(3px); z-index: 60; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet-backdrop.show { opacity: 1; pointer-events: auto; }
.sheet { width: 100%; max-width: 560px; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 22px 22px 0 0; padding: 10px 20px calc(env(safe-area-inset-bottom,0px) + 24px); max-height: 88vh; overflow-y: auto; transform: translateY(30px); transition: transform .25s; }
.sheet-backdrop.show .sheet { transform: none; }
.sheet-grip { width: 42px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 8px auto 16px; }
@media (min-width: 780px) { .sheet-backdrop { align-items: center; } .sheet { border-radius: 22px; } }

/* ==========================================================================
   TradeShield — Client App (single business view) · additional styles
   Layers on top of app.css: business status, AI assistant chat, 24/7 support
   ========================================================================== */

/* ---------- status hero ---------- */
.status-hero {
  position: relative; overflow: hidden; border-radius: var(--radius);
  padding: 20px; border: 1px solid var(--line); box-shadow: var(--shadow);
  background: var(--panel);
}
.status-hero.attention { background: linear-gradient(135deg, rgba(240,182,74,.16), var(--panel)); border-color: rgba(240,182,74,.4); }
.status-hero.risk      { background: linear-gradient(135deg, rgba(255,107,94,.16), var(--panel)); border-color: rgba(255,107,94,.4); }
.status-hero.ontrack   { background: linear-gradient(135deg, rgba(53,210,154,.16), var(--panel)); border-color: rgba(53,210,154,.4); }
.status-hero .sh-top { display: flex; align-items: center; gap: 12px; }
.status-hero .sh-ring { width: 58px; height: 58px; flex: none; position: relative; }
.status-hero .sh-ring svg { width: 58px; height: 58px; transform: rotate(-90deg); }
.status-hero .sh-ring .rt { fill: none; stroke: rgba(120,160,220,.18); stroke-width: 8; }
.status-hero .sh-ring .rv { fill: none; stroke-width: 8; stroke-linecap: round; }
.status-hero .sh-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .92rem; color: #fff; }
.status-hero .sh-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); }
.status-hero .sh-status { font-size: 1.35rem; font-weight: 800; color: #fff; margin-top: 1px; }
.status-hero .sh-summary { font-size: .9rem; color: var(--ink-soft); margin-top: 12px; }
.status-hero .sh-chips { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

/* ---------- greeting ---------- */
.greet { margin: 2px 2px 16px; }
.greet h1 { font-size: 1.5rem; }
.greet p { margin: 2px 0 0; color: var(--ink-faint); font-size: .9rem; }

/* ---------- support enquiry card ---------- */
.support-cta {
  border-radius: var(--radius); padding: 20px; margin-top: 4px;
  background:
    radial-gradient(500px 200px at 90% 0%, rgba(41,194,216,.18), transparent 60%),
    linear-gradient(160deg, var(--navy-soft), var(--panel-solid));
  border: 1px solid var(--line-2);
}
.support-cta h3 { display: flex; align-items: center; gap: 9px; }
.support-cta .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(53,210,154,.18); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 4px rgba(53,210,154,.18);} 50%{box-shadow:0 0 0 7px rgba(53,210,154,.05);} }
.support-cta textarea {
  width: 100%; margin-top: 12px; min-height: 74px; resize: vertical; font-family: inherit; font-size: .92rem;

  /* ---- derived business facts (for KPIs + the assistant) ---- */
  function facts(){
    var overdue = biz.liabilities.filter(function(l){return l.status==="overdue";});
    var hmrc = biz.liabilities.filter(function(l){return l.domain==="HMRC";});
    var upcoming = biz.liabilities.filter(function(l){return (l.amount-l.funded)>0 && daysUntil(l.due)>=-30;}).sort(function(a,b){return new Date(a.due)-new Date(b.due);});
    var pending = biz.actions.filter(function(a){return a.type==="approval"||a.type==="decision"||a.escalated;});
    var domTotals = {}; DOMAINS.forEach(function(d){domTotals[d.key]=0;}); biz.liabilities.forEach(function(l){domTotals[l.domain]=(domTotals[l.domain]||0)+l.amount;});
    var health = Math.max(28, Math.min(96, biz.allocatedPct - (overdue.length?12:0) - Math.min(20, Math.round(biz.fundingGap/biz.totalLiabilities*30))));
    var statusKey = overdue.length ? (biz.fundingGap/biz.totalLiabilities>0.25?"risk":"attention") : (biz.fundingGap>0?"attention":"ontrack");
    return { overdue:overdue, hmrc:hmrc, upcoming:upcoming, pending:pending, domTotals:domTotals, health:health, statusKey:statusKey };
  }

    else if(v==="assistant") renderAssistant();
    else if(v==="support") renderShell(renderSupport(),"support");
    else if(v==="account") renderShell(renderAccount(),"account");
    else renderShell(renderHome(),"home");

  }

  function statusSentence(f){
    var parts=[];
    if(f.overdue.length) parts.push(f.overdue.length+" liabilit"+(f.overdue.length===1?"y is":"ies are")+" overdue ("+gbp(f.overdue.reduce(function(a,l){return a+(l.amount-l.funded);},0))+")");
    if(biz.fundingGap>0) parts.push(gbp(biz.fundingGap)+" still needs funding before its due dates");
    if(f.pending.length) parts.push(f.pending.length+" item"+(f.pending.length===1?"":"s")+" waiting for your approval");
    if(!parts.length) return "Everything is recorded, funded and on track. Nothing needs your attention right now.";
    return "You're "+Math.round(biz.allocatedPct)+"% funded. "+parts.join("; ")+".";
  }
  function stat(label,val,delta,cls){ return '<div class="stat '+(cls||"")+'"><div class="s-label">'+label+'</div><div class="s-val">'+val+'</div>'+(delta?'<div class="s-delta muted">'+delta+'</div>':'')+'</div>'; }

  /* ================= UPDATES (what the team is doing) ================= */
  function renderUpdates(){
    var s = topbar("Updates", "What your TradeShield team is doing");
    var ups = (biz.teamUpdates||[]).slice();
    var active = ups.filter(function(u){return u.status!=="done";});
    var done = ups.filter(function(u){return u.status==="done";});
    var progress = ups.filter(function(u){return u.status==="progress";}).length;
    var awaiting = ups.filter(function(u){return u.status==="awaiting";}).length;
    var order = { awaiting:0, progress:1, scheduled:2 };
    active.sort(function(a,b){ return (order[a.status]-order[b.status]) || (new Date(b.date)-new Date(a.date)); });

      + '<div class="team-stats"><div class="ts"><b>'+progress+'</b><span>In progress</span></div><div class="ts"><b>'+awaiting+'</b><span>Awaiting you</span></div><div class="ts"><b>'+done.length+'</b><span>Completed</span></div></div></div>';

      + '<div class="card" style="margin-top:14px;background:var(--panel-2)"><div class="flex-between" style="font-size:.84rem"><span class="muted">Due date</span><b>'+fmtDate(l.due)+'</b></div><div class="flex-between" style="font-size:.84rem;margin-top:6px"><span class="muted">Paid / reserved</span><b>'+gbp(l.funded)+' of '+gbp(l.amount)+'</b></div><div class="flex-between" style="font-size:.84rem;margin-top:6px"><span class="muted">Legal obligor</span><b>'+esc(l.obligor)+'</b></div></div>'

    body += '<div class="section-label" style="margin-top:18px">History</div>';

  /* ================= AI ASSISTANT ================= */
  function renderAssistant(){
    if(!chat.length){ chat.push({who:"bot", html:"Hi "+esc(client.director.split(" ")[0])+" 👋 I'm your TradeShield assistant. I can see <b>"+esc(client.company)+"</b>'s live position and answer questions about what's due, what's funded and what needs you. Ask me anything — or tap a suggestion below."}); }
    var head = '<div class="chat-head"><div class="ch-av">'+icon("spark")+'</div><div><div class="ch-name">TradeShield Assistant</div><div class="ch-status"><span class="live-dot" style="width:7px;height:7px;box-shadow:none"></span> Online · sees your live data</div></div></div>';
    var msgs = '<div class="chat-scroll" id="chat-scroll">'+chat.map(bubble).join("")+'</div>';
    var chips = ['What is the team doing for me?','What needs my approval?','What\'s overdue?','How much do I owe HMRC?','What\'s my funding gap?','When\'s my next payment?'];
    var chipRow = '<div class="chips-wrap"><div class="chips" id="chips">'+chips.map(function(c){return '<button class="chip" data-chip="'+esc(c)+'">'+esc(c)+'</button>';}).join("")+'</div></div>';
    var composer = '<div class="composer"><input id="chat-input" placeholder="Ask about your business…" autocomplete="off"><button class="send" id="chat-send">'+icon("send")+'</button></div>'
      + '<div class="disclaimer-mini">Assistant answers reflect recorded data. It does not give legal or financial advice.</div>';
    root.innerHTML = '<div class="assistant-screen">'+head+msgs+chipRow+composer+'</div>' + tabbar("assistant");
    bindTabs();
    var input=document.getElementById("chat-input"), sendBtn=document.getElementById("chat-send");
    sendBtn.onclick=function(){ var v=(input.value||"").trim(); if(v){ input.value=""; sendUser(v); } };
    input.onkeydown=function(e){ if(e.key==="Enter"){ var v=(input.value||"").trim(); if(v){ input.value=""; sendUser(v); } } };
    root.querySelectorAll("[data-chip]").forEach(function(b){ b.onclick=function(){ sendUser(b.getAttribute("data-chip")); }; });
    scrollChat();
    setTimeout(function(){ if(input) input.focus(); },50);
  }
  function bubble(m){
    if(m.who==="user") return '<div class="msg user">'+esc(m.text)+'</div>';
    return '<div class="msg bot">'+m.html+'</div>';
  }
  function scrollChat(){ var s=document.getElementById("chat-scroll"); if(s) s.scrollTop=s.scrollHeight; }
  function sendUser(text){
    if((location.hash||"").indexOf("assistant")<0){ location.hash="#/assistant"; setTimeout(function(){ sendUser(text); },260); return; }
    chat.push({who:"user", text:text});
    var scroll=document.getElementById("chat-scroll");
    if(scroll){ scroll.insertAdjacentHTML("beforeend", bubble({who:"user",text:text}));
      var typing=document.createElement("div"); typing.className="typing"; typing.id="typing"; typing.innerHTML="<span></span><span></span><span></span>"; scroll.appendChild(typing); scrollChat();
    }
    var ans = answer(text);
    setTimeout(function(){
      var t=document.getElementById("typing"); if(t) t.remove();
      chat.push({who:"bot", html:ans});
      var s2=document.getElementById("chat-scroll"); if(s2){ s2.insertAdjacentHTML("beforeend", bubble({who:"bot",html:ans})); scrollChat(); }
    }, 650 + Math.min(700, ans.length*3));
  }

  /* ---- the grounded responder ---- */
  function answer(q){
    var f=facts(); var t=q.toLowerCase();
    function listLi(rows){ return '<ul class="m-list">'+rows.map(function(r){return '<li><span>'+esc(r[0])+'</span><b>'+r[1]+'</b></li>';}).join("")+'</ul>'; }
    function has(){ for(var i=0;i<arguments.length;i++){ if(t.indexOf(arguments[i])>-1) return true; } return false; }

    if(has("hello","hi ","hey","good morning","good afternoon")) return "Hello! I'm here to help with anything about <b>"+esc(client.company)+"</b>. Try asking what needs your approval, what's overdue, or how your funding is looking.";
    if(has("thank")) return "You're welcome. Anything else you'd like to check?";

    if(has("approv","attention","waiting","need me","need my","sign off","sign-off","to do","what should i")){
      if(!f.pending.length) return "Nothing is waiting on you right now — you're all caught up. 🎉";
      return "You have <b>"+f.pending.length+"</b> item"+(f.pending.length===1?"":"s")+" waiting for your decision:" + listLi(f.pending.map(function(a){ return [a.title, a.escalated?"Escalated":"Due "+fmtDate(a.due)]; })) + "Open the <b>Home</b> tab and tap one to approve it in seconds.";
    }
    if(has("overdue","late","missed","behind")){
      if(!f.overdue.length) return "Good news — <b>nothing is overdue</b>. Everything recorded is within its due date.";
      var tot=f.overdue.reduce(function(a,l){return a+(l.amount-l.funded);},0);
      return "You have <b>"+f.overdue.length+"</b> overdue item"+(f.overdue.length===1?"":"s")+", totalling <b>"+gbp(tot)+"</b>:" + listLi(f.overdue.map(function(l){return [l.name, gbp(l.amount)];})) + "I'd prioritise these — tap one on the <b>Liabilities</b> tab to see what's needed.";
    }
    if(has("hmrc","vat","paye","nic","corporation","tax")){
      var hmrcTot=f.hmrc.reduce(function(a,l){return a+l.amount;},0);
      var specific = has("vat")?f.hmrc.filter(function(l){return l.category==="VAT";}):has("paye","nic")?f.hmrc.filter(function(l){return l.category==="PAYE & NIC";}):null;
      if(specific && specific.length){ var l=specific[0]; return "Your <b>"+esc(l.category)+"</b> is <b>"+gbp(l.amount)+"</b>, due "+fmtDate(l.due)+" — currently <b>"+ (STATUS_PILL[l.status]||["",l.status])[1] +"</b>"+(l.funded>0?" ("+gbp(l.funded)+" already reserved)":"")+"."; }
      return "Across HMRC (VAT, PAYE, NIC & Corporation Tax) you have <b>"+gbp(hmrcTot)+"</b> recorded:" + listLi(f.hmrc.map(function(l){return [l.category+" · due "+fmtDate(l.due), gbp(l.amount)];}));
    }
    if(has("funding","gap","shortfall","afford","cover","cash","fund")){
      return "Here's your funding position:" + listLi([["Currently funded", biz.allocatedPct+"%"],["Funds allocated", gbp(biz.allocated)],["Paid or reserved", gbp(biz.paidReserved)],["Still to fund", gbp(biz.fundingGap)]]) + (biz.fundingGap>0?"You've <b>"+gbp(biz.fundingGap)+"</b> left to fund before upcoming due dates. Want me to show which liabilities that covers?":"You're fully funded against recorded liabilities. 👍");
    }
    if(has("next payment","upcoming","what's due","whats due","when","due next","coming up","this week")){
      if(!f.upcoming.length) return "Nothing outstanding is coming up — everything's funded.";
      return "Your next payments (soonest first):" + listLi(f.upcoming.slice(0,4).map(function(l){return [l.name+" · "+fmtDate(l.due), gbp(l.amount-l.funded)];}));
    }
    if(has("wage","staff","payroll","people","salar")){
      var w=biz.liabilities.filter(function(l){return l.domain==="People";});
      if(!w.length) return "No staff/payroll liabilities are recorded this period.";
      return "Your people costs:" + listLi(w.map(function(l){return [l.name+" · "+ (STATUS_PILL[l.status]||["",l.status])[1], gbp(l.amount)];}));
    }
    if(has("supplier","supply","purchase","trade")){
      var sup=biz.liabilities.filter(function(l){return l.domain==="Supply";});
      return "Your supply & trade liabilities:" + listLi(sup.map(function(l){return [l.name+" · due "+fmtDate(l.due), gbp(l.amount)];}));
    }
    if(has("what are you doing","what is the team","what's the team","team doing","working on","progress on","update on","what have you done","doing for me","on my behalf","supporting me","what you're doing","whats happening","what's happening","fighting")){
      var ups=(biz.teamUpdates||[]); var act=ups.filter(function(u){return u.status!=="done";}); var dn=ups.filter(function(u){return u.status==="done";});
      if(!ups.length) return "Your team keeps this updated as work happens — nothing logged just yet.";
      return "Here's what your TradeShield team is actively doing for you right now:" + listLi(act.slice(0,4).map(function(u){return [u.title, (U_STATUS[u.status]||["","",""])[1]];})) + "We've also completed <b>"+dn.length+"</b> thing"+(dn.length===1?"":"s")+" for you recently. Open the <b>Updates</b> tab to see every step, who's handling it and what's next.";
    }
    if(has("how is","how's","how am","doing","status","health","overall","summary","position","where do i stand","how are we")){
      return statusSentence(f) + listLi([["Total recorded", gbp(biz.totalLiabilities)],["Overdue", gbp(biz.overdue)],["Still to fund", gbp(biz.fundingGap)],["Waiting on you", f.pending.length+" item"+(f.pending.length===1?"":"s")]]);
    }
    if(has("evidence","audit","proof","document","receipt","record")){
      return "Every liability keeps its <b>evidence</b> (the HMRC notice, funding approval, bank reference and reconciliation note) and a full <b>audit history</b> — who did what, and when. Open any liability and scroll to <b>Evidence</b> and <b>History</b>.";
    }
    if(has("lifecycle","stage","reconcile","process","how does","step")){
      return "Each liability moves through five stages: <b>Recorded → Approved → Funded → Paid → Reconciled</b>. You can see exactly where each one is on its progress bar. Recording or approving something doesn't pay it — it just moves it forward in the process.";
    }
    if(has("help","support","human","agent","call","speak","phone","talk to someone","real person")){
      return "Of course — our team is available <b>24/7</b>. Head to the <b>Support</b> tab to start a live chat, request a callback, or send a message. Want me to take you there?";
    }
    if(has("what can you","what do you do","help me with","options")){
      return "I can tell you, from your live data: what's <b>overdue</b>, what needs your <b>approval</b>, how much you owe <b>HMRC</b>, your <b>funding gap</b>, your <b>next payments</b>, and how your business is <b>doing overall</b>. What would you like to see?";
    }
    // fallback
    return "I can answer that best from your live figures. Try one of these — <b>what needs my approval</b>, <b>what's overdue</b>, <b>how much do I owe HMRC</b>, <b>what's my funding gap</b>, or <b>when's my next payment</b>. For anything else, the <b>Support</b> tab connects you to a person 24/7.";
  }

    return s+out;
  }
  function boundary(title,desc){ return '<div style="display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)"><span style="color:var(--teal);flex:none;margin-top:1px">'+icon("shield").replace('stroke-width="2"','stroke-width="2" style="width:18px;height:18px"')+'</span><div><div style="font-weight:600;color:#fff;font-size:.86rem">'+title+'</div><div class="muted" style="font-size:.78rem">'+desc+'</div></div></div>'; }

  /* ================= sheet ================= */
  function openSheet(html){ var b=document.getElementById("sheet"); if(!b){ b=document.createElement("div"); b.id="sheet"; b.className="sheet-backdrop"; b.innerHTML='<div class="sheet"></div>'; document.body.appendChild(b); b.onclick=function(e){ if(e.target===b) closeSheet(); }; } b.querySelector(".sheet").innerHTML=html; requestAnimationFrame(function(){ b.classList.add("show"); }); }
  function closeSheet(){ var b=document.getElementById("sheet"); if(b) b.classList.remove("show"); }

  /* ================= boot ================= */
  window.addEventListener("hashchange", router);
  router();
})();

</script>
